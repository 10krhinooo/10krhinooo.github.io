<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Victor Kimanga | Backend Software Developer</title>
    <meta
      name="description"
      content="Victor Kimanga is a backend software developer in Nairobi building microservices, REST APIs and event-driven systems with Java, Spring Boot and Quarkus."
    />
    <link rel="canonical" href="https://10krhinooo.github.io/" />
    <meta name="theme-color" content="#0B0D12" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://10krhinooo.github.io/" />
    <meta property="og:title" content="Victor Kimanga | Backend Software Developer" />
    <meta
      property="og:description"
      content="Microservices, REST APIs and event-driven systems in Java, Spring Boot and Quarkus."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before first paint so the correct theme is already on <html> and the page never
      // flashes the wrong palette. Kept inline and blocking on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          );
        } catch (e) {
          /* localStorage unavailable, keep the markup default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
